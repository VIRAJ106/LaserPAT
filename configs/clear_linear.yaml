# clear_linear.yaml — Clear sky, straight-line beacon motion
# Baseline scenario for initial commissioning and repeatability checks.

scenario:
  name: "Clear Linear Baseline"
  duration_seconds: 60
  seed: 1

environment:
  world_size: [2000, 2000]
  platform_motion:
    type: "linear"
    max_speed_px_frame: 0   # stationary platform

beacon:
  shape: "gaussian"
  size_px: [10, 10]
  motion: "straight"
  initial_location: "random"

camera:
  initial_position: "center"
  resolution: [640, 480]
  fov_deg: [4.0, 3.0]
  monochrome: true
  gimbal:
    max_pan_rate_deg_s: 5.0
    max_tilt_rate_deg_s: 5.0

disturbances:
  sensor_noise:
    gaussian_sigma: 5          # low noise — clear conditions
    poisson: false
    salt_and_pepper_percent: 0
  jitter:
    max_displacement_px: 5
  weather_preset: "clear"
  weather_physics:
    derive_from_cn2: true
    cn2_ground: 1.0e-16        # very low turbulence
    wind_rms_speed: 3

link_budget:
  wavelength_nm: 1550
  beam_divergence_mrad: 0.5
  report_at_end_of_run: true

evaluation:
  run_ab_comparison: true

detection:
  acquisition_mode: "blind_spiral"
  use_cnn_verifier: true

estimation:
  filter: "kf_cv"
  lock_threshold_px: 10
  lock_frames: 3

control:
  controller: "pid"
  pid:
    kp: 0.15
    ki: 0.005
    kd: 0.005
    antiwindup: true

logging:
  csv_per_frame: true
  auto_report: true
