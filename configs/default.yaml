scenario:
  name: "Baseline Testing"
  duration_seconds: 60
  seed: 42

environment:
  world_size: [2000, 2000]
  platform_motion:
    type: "static"           # Platform is stationary by default
    max_speed_px_frame: 0

beacon:
  shape: "gaussian"
  size_px: [20, 20]
  target_size_px: [0, 0]
  motion: "straight"
  initial_location: "center" # Start in FOV so acquisition is immediate

camera:
  initial_position: "center"
  resolution: [640, 480]
  fov_deg: [4.0, 3.0]
  monochrome: true
  gimbal:
    max_pan_rate_deg_s: 5.0
    max_tilt_rate_deg_s: 5.0

disturbances:
  sensor_noise:
    gaussian_sigma: 5          # Low noise for default — use sih_benchmark.yaml for full stress
    poisson: false
    salt_and_pepper_percent: 0
  jitter:
    max_displacement_px: 1
  weather_preset: "clear"      # Clear sky for default baseline
  weather_physics:
    derive_from_cn2: false     # Use explicit gaussian_sigma above; Cn2 used for link budget only
    cn2_ground: 1.0e-17        # Realistic weak turbulence (clear open-air 1km link)
    wind_rms_speed: 5

link_budget:
  wavelength_nm: 1550
  beam_divergence_mrad: 0.5
  report_at_end_of_run: true

evaluation:
  run_ab_comparison: true

estimation:
  filter: "kf_cv"
  lock_threshold_px: 10
  lock_frames: 3

control:
  controller: "pid"
  pid:
    kp: 0.30
    ki: 0.008
    kd: 0.008
    antiwindup: true
  lock_window_px: 2.0

detection:
  acquisition_mode: "blind_spiral"
  use_cnn_verifier: true
  backend: "classical_cnn"
  threshold: 30              # Pixel intensity threshold for blob detection

logging:
  csv_per_frame: true
  auto_report: true
